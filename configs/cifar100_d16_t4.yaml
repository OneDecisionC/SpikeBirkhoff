# CIFAR-100; depth 16, width 256, T=4, chunk=2.
# Training uses 200 main epochs plus 10 cooldown epochs.
# The method is selected by the training CLI; this file defaults to Birkhoff.
data_dir: ./data
dataset: torch/cifar100
model: sdt
pretrained: false
spike_mode: lif
attention_mode: STAtten
num_classes: 100
num_heads: 8
img_size: 32
patch_size: 4
in_channels: 3
mean:
- 0.5071
- 0.4867
- 0.4408
std:
- 0.2675
- 0.2565
- 0.2761
crop_pct: 1.0
scale:
- 1.0
- 1.0
ratio:
- 1.0
- 1.0
interpolation: bicubic
train_interpolation: bicubic
use_conv_as_linear: true
pooling_stat: '0011'
time_steps: 4
chunk_size: 2
layer: 16
dim: 256
mlp_ratio: 4
drop_path: 0.2
routing: birkhoff
n_streams: 2
routing_init_scale: 0.01
collect_diagnostics: true
aa: rand-m9-n1-mstd0.4-inc1
color_jitter: 0.5
hflip: 0.5
vflip: 0.0
reprob: 0.0
mixup: 0.5
mixup_off_epoch: 200
mixup_prob: 1.0
mixup_mode: batch
mixup_switch_prob: 0.5
cutmix: 0.0
smoothing: 0.1
seed: 42
amp: false
channels_last: false
batch_size: 64
val_batch_size: 64
opt: adamw
lr: 0.0003
min_lr: 1.0e-05
weight_decay: 0.06
sched: cosine
epochs: 200
cooldown_epochs: 10
warmup_epochs: 20
warmup_lr: 1.0e-06
workers: 4
model_ema: false
model_ema_decay: 0.9998
log_interval: 100
checkpoint_hist: 10
max_train_batches: 0
max_val_batches: 0
TET: false
TET_means: 1.0
TET_lamb: 0.0
output: ./runs
