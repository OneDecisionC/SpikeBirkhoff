dataset: cifar10-dvs
model: sdt
pretrained: false
spike_mode: lif
attention_mode: STAtten
num_classes: 10
num_heads: 8
img_size: 64
patch_size: 4
in_channels: 2
crop_pct: 1.0
scale: [1.0, 1.0]
ratio: [0.2, 1.0]
interpolation: bicubic
train_interpolation: bicubic
use_conv_as_linear: true
pooling_stat: '0011'
time_steps: 16
chunk_size: 4
layer: 2
dim: 256
mlp_ratio: 4
drop_path: 0.2
routing: birkhoff
n_streams: 2
routing_init_scale: 0.01
collect_diagnostics: true
color_jitter: 0.0
hflip: 0.5
vflip: 0.0
mixup: 0.0
smoothing: 0.1
seed: 42
amp: true
native_amp: true
channels_last: false
batch_size: 16
val_batch_size: 16
opt: adamw
lr: 0.01
min_lr: 0.0003
weight_decay: 0.0001
sched: cosine
epochs: 200
cooldown_epochs: 10
warmup_epochs: 10
warmup_lr: 0.001
workers: 4
model_ema: false
log_interval: 200
checkpoint_hist: 1
max_train_batches: 0
max_val_batches: 0
TET: true
TET_means: 1.0
TET_lamb: 0.001
