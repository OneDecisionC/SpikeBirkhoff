# N-Caltech101; depth 2, width 256, T=16, chunk=4.
# Training uses 200 main epochs plus 10 cooldown epochs.
# The method is selected by the training CLI; this file defaults to Birkhoff.
# The event dataset loader uses nearest-neighbor resize and raw counts.
data_dir: ./data
dataset: ncaltech101
pretrained: false
num_classes: 101
num_heads: 8
img_size: 64
crop_pct: 1.0
scale:
- 1.0
- 1.0
ratio:
- 0.2
- 1.0
color_jitter: 0.0
interpolation: bicubic
train_interpolation: bicubic
use_conv_as_linear: true
pooling_stat: '0011'
in_channels: 2
time_steps: 16
chunk_size: 4
layer: 2
dim: 256
mlp_ratio: 4
hflip: 0.5
model_ema: false
model_ema_decay: 0.9998
seed: 42
amp: false
channels_last: false
batch_size: 16
val_batch_size: 16
lr: 0.01
min_lr: 3e-4
sched: cosine
weight_decay: 1e-4
epochs: 200
cooldown_epochs: 10
warmup_epochs: 10
warmup_lr: 1e-3
opt: adamw
smoothing: 0.1
workers: 4
model: sdt
attention_mode: STAtten
spike_mode: lif
routing: birkhoff
n_streams: 2
routing_init_scale: 0.01
collect_diagnostics: true
TET: false
checkpoint_hist: 2
log_interval: 100
max_train_batches: 0
max_val_batches: 0
output: ./runs
drop_path: 0.2
